  - packages/web-next/tests/room6-settings.e2e.spec.ts
anchors:
  settings-navigation-reuses-live-session:
    mounted-settings-route:
      action: change
      reason: Add the in-app Settings route, connector reuse, and History API behavior
        together with its regression proof.
