verification: Run the Codex adapter suite (adapter/policy/lifecycle/bridge
  specs), the switchboard daemon suite (interaction re-correlation + orphan),
  and typecheck for both packages. Then run the spend-gated live smoke
  (CODOR_LIVE_SMOKE) with one approve path and one deny path across at most a
  couple of turns to confirm a real approval card surfaces and the decision
  reaches Codex. Run Harn unstaged and staged gates, apply the locked plan, and
  commit as one implementation transaction on fix/codex-approvals with no push.
