verification: >
  Web-next full unit suite and build pass. Focused room3 context presentation,
  compaction, clear-context, lifecycle, phone geometry, and Axe checks pass. At
  1440px and 390px the ring, Compact, Clear context, and overflow share one
  center line; every phone control remains at least 44x44 and inside the card;
  Compact and Clear context expose target-specific accessible names while their
  visible labels remain exact. Harn plan/diff/staged/apply checks and git diff
  --check pass in one implementation commit.
