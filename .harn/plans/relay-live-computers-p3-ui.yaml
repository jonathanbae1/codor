anchors:
  hosted-computer-switcher-is-discoverable-and-accessible:
    discoverable-computer-control:
      action: change
      reason: Add the trigger, shared choice rows, responsive styles, focus behavior,
        activity badge, recovery presentation, and regressions.
  hosted-add-computer-explains-pairing-code-source:
    guided-add-computer:
      action: change
      reason: Add the two-step copyable command guidance, expiry/relay copy,
        documentation, and tests while retaining PairingCodeInput.
  hosted-background-computer-activity-is-visible:
    background-computer-summary:
      action: change
      reason: Expose the already-owned auth-refused state as an honest Repair required
        label without changing background ingestion.
  hosted-offline-recovery-offers-other-computers:
    multi-computer-recovery-exit:
      action: change
      reason: Replace plain recovery buttons with the same accessible computer-choice
        presentation while preserving activation.
