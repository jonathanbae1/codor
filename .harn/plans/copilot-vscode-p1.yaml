  Run focused native-chat, adapter/bridge, registry, and daemon tests, including
  all approval-state and exact-revive boundaries; build the Copilot adapter,
  workspace extension, switchboard, and web-next; package a provisional VSIX and
  inspect its contents without delivering it; run the full workspace build and
  serialized test suite; run Harn check, lock, apply, and staged validation; run
  git diff --check and leave the dedicated worktree clean. No authenticated VS
  Code smoke, release artifact delivery, version bump, push, merge, or deploy is
  part of this phase.
