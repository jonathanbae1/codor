      action: change
      reason: Add the manually installed workspace-hosted extension manifest and
        packaging metadata.
    vscode-copilot-loopback-runtime:
      action: change
      reason: Add the bounded authenticated loopback server and private discovery
        lifecycle.
    vscode-copilot-discovery-client:
      action: change
      reason: Validate the private discovery record and use only its authenticated
        loopback endpoint.
    vscode-copilot-bridge-regression:
      action: change
      reason: Cover bearer authentication, availability, bounds, and credential-free
        bridge shapes.
    vscode-copilot-manual-install-doc:
      action: change
      reason: Document explicit manual VSIX/Marketplace installation and reload.
  vscode-copilot-native-agent-auto-approves-and-streams-evidence:
    vscode-copilot-native-chat-runtime:
      action: change
      reason: Open a fresh native Agent chat, enable /autoApprove, stream evidence,
        and handle native Allow locally.
    vscode-copilot-native-chat-regression:
      action: change
      reason: Cover ordinary, hard-blocked, repeated, pre/post confirmation, no-op
        Allow, and cancellation lifecycles.
    vscode-copilot-adapter-runtime:
      action: change
      reason: Add the ordinary adapter client and normalized stream without approval
        cards or HTTP decisions.
    vscode-copilot-adapter-regression:
      action: change
      reason: Cover live models, authenticated evidence, no approval.raised,
        unavailable bridge, and interrupt.
    vscode-copilot-model-catalog:
      action: change
      reason: Preserve live model discovery from the native bridge.
  copilot-vscode-revive-requires-exact-live-cache:
    revive-native-session:
      action: change
      reason: Gate the explicit copilot-vscode live-cache branch while retaining exact
        resumable attach.
    revive-session-regression:
      action: change
      reason: Prove exact live-generation reuse, cache/bridge loss failure, ACP
        rejection, and resumable attach.
  adapter-registry-sole-harness-source:
    configured-adapter-registry:
      action: change
      reason: Register copilot-vscode as a separate built-in adapter.
    hardcoded-list-guard:
      action: change
      reason: Account for two built-in adapter ids sharing the Copilot package import.
  adapter-catalog-distinguishes-installed-and-configurable:
    adapter-catalog-registry:
      action: change
      reason: Carry the bridge availability probe through the registry.
    adapter-catalog-daemon:
      action: change
      reason: Derive installed state from validated live bridge presence.
    adapter-catalog-regression:
      action: change
      reason: Cover unavailable and live bridge-backed catalog state.
  adapter-refresh-is-authorized-and-incremental:
    adapter-refresh-runtime:
      action: change
      reason: Recheck bridge availability and discover models on transition.
  adapters-own-their-model-catalog:
    adapter-model-discovery-regression:
      action: change
      reason: Prove the live bridge catalog reaches the ordinary adapter listing.
  adapter-wrappers-preserve-the-whole-contract:
    registry-wrapper-completeness:
      action: change
      reason: Preserve the bridge availability and exact live-session predicate
        through the production wrapper.
  live-inbox-capability-is-evidence-backed-v2:
    builtin-live-inbox-matrix:
      action: change
      reason: Add the truthful false copilot-vscode capability row.
  harness-declares-supported-thinking-levels:
    registry-thinking-level-regression:
      action: change
      reason: Add the truthful no-thinking copilot-vscode row.
  revive-via-session-ref:
    revive-native-session:
      action: remove
      reason: Replace the universal attach-only wording with the explicit
        adapter-id-gated rule.
