anchors:
  paired-browser-challenge-session:
    browser-device-session-rest:
      action: change
      reason: Extend only the successful signed session response with the bounded
        hostname while challenge and refusal shapes remain unchanged.
  authenticated-browser-session-reveals-bounded-hostname:
    browser-session-hostname:
      action: change
      reason: Define hostname normalization and its placement exclusively in the
        authenticated success response, with server contract regressions.
  hosted-generated-computer-label-follows-authenticated-hostname:
    authenticated-computer-label:
      action: change
      reason: Carry the optional hostname through each session-owned authentication
        result and persist fallback/hostname/custom label provenance so only the
        addressed generated label changes.
  hosted-attachments-follow-active-computer-tunnel:
    hosted-attachment-transport:
      action: change
      reason: Route exact upload and retrieval bytes through relayFetch, manage object
        URL lifetime for transcript/Preview consumers, and prove the separate-
        origin hosted path without changing the server attachment contract.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: The session-owned authentication result now updates only its entry's
        generated label while tokens, connectors, stores, and retry lifecycle
        remain isolated.
