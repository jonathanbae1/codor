anchors:
  hosted-app-keeps-all-paired-computers-live:
    computer-session-lifecycle:
      action: change
      reason: Make the existing manager survive revocation, not-ready activation,
        active forget, and scoped teardown without dropping other warm sessions.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: Close browser cache and room-key attribution leaks for identical room
        ids while retaining isolated stores and connectors.
  hosted-computer-switching-reuses-warm-session:
    warm-computer-activation:
      action: change
      reason: Validate readiness before mutating persisted or visible active state and
        reset the active UI boundary by computer id.
  hosted-offline-recovery-offers-other-computers:
    multi-computer-recovery-exit:
      action: change
      reason: Reach existing alternatives after the first bounded failure and prevent
        connectorless recovery transitions.
  hosted-background-computer-activity-is-visible:
    background-computer-summary:
      action: change
      reason: Keep background ingestion while confining resume and upgrade side
        effects to the active computer.
  settings-navigation-reuses-live-session:
    mounted-settings-route:
      action: change
      reason: Preserve the mounted Settings route across readiness-safe
        active-computer changes.
