anchors:
  hosted-app-keeps-all-paired-computers-live:
    computer-session-lifecycle:
      action: change
      reason: Add the hosted-only manager that starts, retries and disposes one
        existing session stack per indexed computer.
  hosted-computer-sessions-keep-state-isolated:
    per-computer-session-state:
      action: change
      reason: Parameterize archive reads, auth, connector stores and React store
        selection so concurrent sessions cannot share credentials or room state.
  hosted-computer-switching-reuses-warm-session:
    warm-computer-activation:
      action: change
      reason: Activate the persisted generation and existing session in place,
        preserving per-computer room selection and the other live sessions.
  hosted-offline-recovery-offers-other-computers:
    multi-computer-recovery-exit:
      action: change
      reason: Make both boot and overlay recovery expose warm alternatives without
        stopping the offline computer's retry loop.
  hosted-background-computer-activity-is-visible:
    background-computer-summary:
      action: change
      reason: Derive the small per-computer connection/unread/attention/working
        summary from each isolated live store for functional switcher coverage.
  settings-navigation-reuses-live-session:
    mounted-settings-route:
      action: change
      reason: RoomPage changes from one connector ref to the active managed connector,
        while Settings must still reuse that mounted connection.
