id: release-0-10-9-copilot-vscode
title: Release the reviewed Copilot VS Code bridge as 0.10.9
notes: >
  Advance the existing repository release set from 0.10.8 to 0.10.9 and align
  the companion codor-copilot-bridge VSIX identity. Update the ACP initialize
  client identity to the same release version. Build, inspect, and smoke the
  public TGZ and matching VSIX without publishing, tagging, pushing, deploying,
  Taildropping, or installing on remote targets.
