verification: >
  Every manifest in the existing 0.10.8 release set plus the companion extension
  reports 0.10.9, and the ACP client identity reports 0.10.9. Focused extension,
  adapter, and ACP tests/builds pass; the full workspace build and serialized
  tests, release/license audits, fresh and packed install proofs, and final
  TGZ/VSIX content and SHA-256 inspection pass. Safe real VS Code smoke evidence
  is recorded when the pinned native bridge is available, with any unsafe or
  unavailable failure mode reported honestly. Do not publish, tag, push, deploy,
  Taildrop, or install on remote targets.
