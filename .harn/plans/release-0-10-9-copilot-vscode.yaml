  reviewed:
    - id: public-package-bundles-complete-codor-runtime
      outcome: unchanged
      reason: >
        The public artifact continues to bundle the exact runtime closure and
        resolve every staged workspace dependency to the release versions.
    - id: public-package-readme-renders-on-npm
      outcome: unchanged
      reason: The npm-safe README and install command remain unchanged.
    - id: acp-v1-events-and-capabilities-are-negotiated
      outcome: unchanged
      reason: >
        Only the ACP initialize clientInfo release identity advances; protocol
        negotiation, capabilities, and normalized runtime behavior remain
        unchanged.
    - id: artifact-build-runs-from-clean-source
      outcome: unchanged
      reason: >
        The artifact builder and its clean-source build contract remain
        unchanged; this plan only advances release identities.
    - id: release-audits-enforce-codor-clean-break
      outcome: unchanged
      reason: Existing release and license audits continue to enforce repository
        identity.
    - id: release-candidate-requires-publishable-install-tarball
      outcome: unchanged
      reason: >
        The candidate still requires the existing deterministic gates and exact
        packed-install evidence before any later publication decision.
    - id: vscode-copilot-bridge-is-manual-local-and-credential-private
      outcome: unchanged
      reason: >
        The companion remains manually installed, loopback-only, and credential
        private; only its package version changes.
    - id: workspace-gates-cover-all-buildable-projects
      outcome: unchanged
      reason: Recursive build/test project coverage remains unchanged.
