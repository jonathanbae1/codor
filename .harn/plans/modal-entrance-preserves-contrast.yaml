  - packages/web-next/src/styles/primitives.css
  - packages/web-next/tests/room36-computer-ui.e2e.spec.ts
verification: >
  Check and lock on the clean tagged baseline; run the Room 36 browser test
  repeatedly with its animation held at midpoint, the web build and units, and
  Harn validation; commit and push main, require green main CI, then recreate
  the still-unpublished v0.10.10 tag and verify npm plus GitHub Release output.
