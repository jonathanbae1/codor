anchors:
  engine-reported-window-outlives-restarts:
    persisted-window-seed:
      action: remove
      reason: Replace the unscoped monotonic restart contract with current-model and
        current-session persisted truth.
  claude-context-ceiling-preserves-engine-provenance:
    claude-context-provenance:
      action: change
      reason: Record curated-versus-engine provenance per current native model and
        prevent same-model bootstrap events from downgrading learned truth.
    claude-context-provenance-regression:
      action: change
      reason: Cover same-model seed preservation, actual model changes, and later
        smaller engine reports without hardcoded or global-max behavior.
  current-context-window-truth-outlives-restarts:
    persisted-window-seed:
      action: change
      reason: Scope persisted engine reports to the unchanged configured model and
        invalidate them on model change or successful native-context reset.
  context-ceiling-follows-main-model:
    claude-main-model-window:
      action: change
      reason: Track bootstrap-versus-engine provenance per native model and prevent
        same-model bootstrap events from downgrading learned truth.
    claude-main-model-window-regression:
      action: change
      reason: Preserve existing matching-main-model and auxiliary-model exclusion
        regressions while extending the cases around provenance.
  member-task-projection-is-durable-and-session-scoped:
    member-task-storage:
      action: change
      reason: The atomic fresh-context store transaction clears tasks when session_ref
        becomes absent by explicit operator action.
    member-task-daemon-regression:
      action: change
      reason: Prove fresh-session reset clears tasks while retained native
        identity/configuration and ordinary same-session behavior remain.
  member-context-reset-is-authorized-atomic-and-lazy:
    adapter-reset-contract:
      action: change
      reason: Define the optional adapter hook as complete retirement/forgetting with
        no new native session creation.
    clear-context-act-schema:
      action: change
      reason: Add the bounded targeted clear_member_context websocket act and protocol
        regression.
    clear-context-role-gate:
      action: change
      reason: Set owner/admin minimum role and keep the act out of agent authority.
    clear-context-store-transaction:
      action: change
      reason: Atomically clear session-scoped columns, revoke the credential, re-arm
        briefing flags, append one member change, and preserve retained columns.
    clear-context-runtime-lease:
      action: change
      reason: Gate/reset/retire/delete caches and transient state, audit success, and
        release queued-after-start work only onto the fresh path.
    clear-context-server-dispatch:
      action: change
      reason: Dispatch the async act and correlate refusals/failures without a false
        success frame.
    claude-session-reset:
      action: change
      reason: Await query interruption/close/pump settlement and remove both weak and
        member-keyed runtime entries.
    codex-session-reset:
      action: change
      reason: Cancel parked requests, dispose the client/child, and forget thread and
        member runtime identity.
    acp-session-reset:
      action: change
      reason: Retire the persistent ACP connection/process before its negotiated
        lifecycle and session id are cleared.
    first-party-cli-session-reset:
      action: change
      reason: Give every one-shot built-in an honest reset hook that refuses an
        unexpected live child and otherwise confirms no idle runtime remains.
    clear-context-web-control:
      action: change
      reason: Add confirmed role-gated dispatch with pending/error/member-frame
        completion behavior, leaving final layout to Phase 4.
    clear-context-browser-regression:
      action: change
      reason: Prove confirmation, no duplicate dispatch, authoritative ring clearing,
        fresh next native id, retained history/configuration, errors, and Axe
        behavior.
  claude-agent-sdk-query-is-the-session-runtime:
    claude-sdk-session-lifecycle:
      action: change
      reason: Expose the existing full query retirement path for the explicit reset
        contract without changing ordinary retained turns.
    claude-sdk-session-regression:
      action: change
      reason: Prove explicit reset fully retires and forgets the cached query while
        ordinary sequential turns continue sharing it.
  claude-sdk-message-contract-preserves-normalized-runs:
    claude-sdk-message-translation:
      action: change
      reason: Carry private ceiling provenance through the existing cross-turn
        translation context without changing normalized wire events.
  codex-app-server-is-the-member-runtime:
    codex-app-server-session-lifecycle:
      action: change
      reason: Expose full runtime disposal for explicit reset while preserving
        ordinary app-server retention.
    codex-app-server-session-regression:
      action: change
      reason: Prove reset cancels parked work, disposes the cached app-server, and
        prevents reuse of the retired thread.
  acp-v1-events-and-capabilities-are-negotiated:
    acp-adapter-runtime:
      action: change
      reason: Add complete idle runtime retirement before the daemon discards
        negotiated session lifecycle.
    acp-adapter-regression:
      action: change
      reason: Prove reset retires the retained provider process and ordinary ACP
        negotiation/resume behavior remains intact.
  adapter-process-lifecycle-supervised:
    antigravity-cli-process-supervision:
      action: change
      reason: Add an idle-only reset hook without weakening supervised turn cleanup.
    copilot-cli-process-supervision:
      action: change
      reason: Add an idle-only reset hook without weakening supervised turn cleanup.
    gemini-cli-process-supervision:
      action: change
      reason: Add an idle-only reset hook without weakening supervised turn cleanup.
    grok-cli-process-supervision:
      action: change
      reason: Add an idle-only reset hook without weakening supervised turn cleanup.
    opencode-cli-process-supervision:
      action: change
      reason: Add an idle-only reset hook without weakening supervised turn cleanup.
  roles-gate-human-acts-not-agents:
    role-matrix-source:
      action: change
      reason: Add clear_member_context at admin rank; agent capabilities remain
        deliberately unchanged.
  durable-agent-runtime-configuration:
    durable-agent-runtime-storage:
      action: change
      reason: The reset transaction clears per-session lifecycle/baselines while
        preserving the private ACP launch record.
  last-agent-usage-is-transient-and-seeded:
    last-usage-runtime-registry:
      action: change
      reason: Successful reset removes only the selected member's transient usage;
        model changes also discard stale pre-change display evidence.
    last-usage-member-projection:
      action: change
      reason: The authoritative reset member frame omits the removed usage so the old
        ring disappears only after server success.
  compaction-reinjects-codor-briefing:
    daemon-briefing-reinjection-helper:
      action: change
      reason: Reuse its flag semantics in the atomic reset while preserving
        misaddressed and leaving compaction behavior intact.
  manual-compaction-leases-out-turn-admission:
    compaction-lease-state:
      action: change
      reason: Add a sibling reset lease and mutual exclusion without altering
        compaction ownership.
    compaction-lease-regression:
      action: change
      reason: Prove compaction and context reset refuse one another and neither admits
        a racing turn.
  manual-compaction-is-an-operator-act:
    compact-member-contract:
      action: change
      reason: Keep compact dispatch behavior unchanged while adding the distinct
        clear-context server action beside it.
  turn-start-requires-owned-custody:
    shared-turn-start-custody-gate:
      action: change
      reason: Add reset-lease exclusion to the shared final admission gate so no
        ordinary, reconciled, or released turn can race native retirement.
  member-config-is-changed-not-respawned:
    configure-member-daemon:
      action: change
      reason: An actual model setting change drops only stale context-window evidence
        while preserving the current native resume session.
  normalized-agent-usage-telemetry-with-estimates:
    claude-usage-telemetry:
      action: change
      reason: Thread private ceiling provenance across turn translators without
        changing public AgentUsage fields.
