verification: >
  Focused Room 3 and Room 30 Playwright suites prove avatar spanning, Row 1
  identity/session pills, Row 2 shared harness mark, full model pill, icon-only
  policy and actions, unchanged below-row 5h/7d indicators/tooltips, invisible
  flexible spacer, fixed action order, guarded reset/compaction/lifecycle
  dispatch, two-row narrow geometry, Row-2-local metadata overflow,
  non-overlapping 44px phone targets, small task marks, spinner behavior,
  all-completed disappearance, and Axe. Run the complete web-next Playwright
  suite, all web-next units, full serialized workspace tests, full workspace
  builds, license and release audits, and fresh and packed/Docker install
  proofs. Prove the exact local-TGZ npx command from a fresh cache and again
  from the same warm cache against unchanged 0.10.10 bytes. Build and inspect
  the final TGZ and VSIX for versions, expected contents, no source/tests/
  secrets, byte sizes, and SHA-256 values. Run Harn check, apply, staged
  validation, and git diff checks. No external action occurs before investigator
  review.
