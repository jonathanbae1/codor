anchors:
  hosted-computer-switcher-is-discoverable-and-accessible:
    discoverable-computer-control:
      action: change
      reason: Portal and position the popup outside clipping ancestors, preserve its
        focus/close contract, and add real viewport and hit-testing regressions.
  hosted-add-computer-explains-pairing-code-source:
    guided-add-computer:
      action: change
      reason: Present the existing command and code-entry steps together in one
        dialog, update documentation, and remove wizard-only controls and tests.
  hosted-computer-switching-reuses-warm-session:
    warm-computer-switch:
      action: change
      reason: Keep multi-computer browser coverage proving portaled choices still use
        the warm in-place activation path.
  hosted-generated-computer-label-follows-authenticated-hostname:
    authenticated-computer-label:
      action: change
      reason: Keep the Phase 1 hostname labels visible in the relocated picker and
        multi-computer browser regressions without changing provenance.
