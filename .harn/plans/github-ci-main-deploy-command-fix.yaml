id: github-ci-main-deploy-command-fix
title: Invoke the relay package deploy script explicitly in GitHub CI
notes: >
  The first live main run passed every verification gate but pnpm parsed the
  bare filtered `deploy` token as its workspace deployment command, which
  requires a target directory, instead of the relay package.json script. Add the
  explicit `run` disambiguator. Keep event, secret, permission, test, deployment
  order, Wrangler configuration, Pages guard, and application code unchanged.
