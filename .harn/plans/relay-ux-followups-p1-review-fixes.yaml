  - packages/web-next/tests/room32-relay-journey.e2e.spec.ts
anchors:
  hosted-attachments-follow-active-computer-tunnel:
    hosted-attachment-transport:
      action: change
      reason: Make raster retrieval viewport/Preview-demanded and download retrieval
        click-demanded while retaining routed bytes, type checks, inert
        failures, and deterministic object-URL revocation.
  hosted-generated-computer-label-follows-authenticated-hostname:
    authenticated-computer-label:
      action: change
      reason: Persist inferred custom provenance during the existing serialized
        hostname-adoption operation while preserving the operator's label.
