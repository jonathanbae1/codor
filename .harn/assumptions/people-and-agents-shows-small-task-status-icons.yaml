id: people-and-agents-shows-small-task-status-icons
hash: a-f02c3fe58232
title: People and agents renders bounded actionable tasks with small status icons
state: active
statement: >
  An agent card renders a task section only while its durable member task
  projection contains at least one non-completed item; an empty or all-completed
  projection renders no task section without mutating durable state. Pending
  rows use a small hollow dot, completed rows use a small check, and in-progress
  rows use a small indeterminate spinning loader; each mark carries an
  accessible status name while visible Pending, In progress, and Completed words
  remain omitted. In-progress text may use native active_form and completed
  content in a mixed list remains muted and struck. At most five rows are
  initially visible, Show all and Show fewer control the remainder, the expanded
  list scrolls inside a 240px bound, and optional explanation is subdued
  context. Member frames update the existing store live with no polling, client
  task cache, or write-back.
depends_on:
  - member-task-projection-is-durable-and-session-scoped
created_by: npx-member-ui-0-10-10
