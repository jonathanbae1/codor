id: vscode-copilot-bridge-is-manual-local-and-credential-private
hash: a-d48c2fe64515
title: The VS Code Copilot bridge is manual, local, and credential-private
state: active
statement: >
  The copilot-vscode companion must be installed explicitly by the operator, run
  in the VS Code workspace extension host, bind only 127.0.0.1, authenticate
  every bounded request with a random bearer token published through one atomic
  user-private discovery record, and remove that record on clean shutdown. It
  must use the already-installed official Copilot extension and VS Code-owned
  authentication without inspecting, copying, logging, returning, or
  transmitting GitHub or VS Code credentials. Codor setup and runtime must never
  install, update, or publish the extension automatically.
depends_on:
  - adapter-registry-sole-harness-source
  - adapter-catalog-distinguishes-installed-and-configurable
created_by: copilot-vscode-p1
