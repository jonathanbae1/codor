title: Packed local TGZ proof exercises a fresh default-audit npx install
state: active
statement: >
  The packed-install gate must invoke the exact local-TGZ npx path first with an
  empty dedicated npm cache and without disabling npm audit, then repeat it
  warm, because a pre-populated cache can hide install-time advisory traversal
  failures before Codor code starts.
